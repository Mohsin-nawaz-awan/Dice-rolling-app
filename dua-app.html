<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
  <style>
    body {
      text-align: center;
      margin-top: 100px;
      padding: 20px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      margin-top: 20px;
    }
    #dua {
      font-size: 20px;
      margin-top: 30px;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
    }
  </style>
</head>
<body>

  <h1>
    Dua App
  </h1>
  <button onclick="showDua()">S
    how Dua

  </button>

  <div id="dua">Click</div>

</body> 
  <script>
    const duas = [
      "اللَّهُمَّ اغْفِرْ لِي (O Allah, forgive me)",
      "رَبِّ زِدْنِي عِلْمًا (My Lord, increase me in knowledge)",
      "اللَّهُمَّ اهْدِنِي (O Allah, guide me)",
      "رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً (Our Lord, give us good in this world)",
      "اللَّهُمَّ ارْحَمْنِي (O Allah, have mercy on me)"
    ];

    function showDua() {
      let randomIndex = Math.floor(Math.random() * duas.length);
      document.getElementById("dua").innerText = duas[randomIndex];
    }

 </script>
</html>
